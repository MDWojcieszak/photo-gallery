<!doctype html>
<!-- Inline background: dark from the very first paint, before CSS/JS arrive on a slow connection. -->
<html lang="en" style="background-color: #0c0c0e">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mateusz Wojcieszak — Photography</title>
    <meta
      name="description"
      content="Landscape, cityscape and travel photography by Mateusz Wojcieszak — a curated selection of moments captured around the world."
    />
    <meta name="theme-color" content="#0c0c0d" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the dark background paints without waiting for Google. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" /></noscript>
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Mateusz Wojcieszak" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mateusz Wojcieszak" />
    <meta property="og:title" content="Mateusz Wojcieszak — Photography" />
    <meta
      property="og:description"
      content="Landscape, cityscape and travel photography — a curated selection of moments captured around the world."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mateusz Wojcieszak — Photography" />
    <meta
      name="twitter:description"
      content="Landscape, cityscape and travel photography — a curated selection of moments captured around the world."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mateusz Wojcieszak",
        "jobTitle": "Photographer",
        "address": { "@type": "PostalAddress", "addressLocality": "Cracow", "addressCountry": "PL" },
        "sameAs": ["https://www.instagram.com/mdwo.j"]
      }
    </script>
  </head>
  <body style="margin: 0; background-color: #0c0c0e">
    <div id="root"></div>
    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
